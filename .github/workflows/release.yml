name: Build and Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check tag matches Cargo.toml version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${VERSION} (expected v${VERSION})"
            exit 1
          fi
      - run: cargo test --locked

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # 64-bit Raspberry Pi OS (Pi 3/4/5, Zero 2 W)
          - target: aarch64-unknown-linux-gnu
            arch: arm64
          # 32-bit Raspberry Pi OS; ARMv6 so it also runs on Pi 1 and Zero (W)
          - target: arm-unknown-linux-gnueabihf
            arch: armhf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build binary
        run: cross build --locked --release --target ${{ matrix.target }}

      - name: Build tarball for setup.sh
        run: |
          mkdir -p tarball
          cp target/${{ matrix.target }}/release/beatnik-hardware-api tarball/
          cp -r camilladsp beatnik-hardware.service camilladsp.service camilladsp-preamp.service setup.sh tarball/
          tar -czvf beatnik-hardware-api-${{ matrix.arch }}.tar.gz -C tarball .

      - name: Build Debian package
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          ARCH=${{ matrix.arch }}
          ROOT=package_root
          mkdir -p $ROOT/opt/beatnik-hardware-api $ROOT/etc/systemd/system $ROOT/DEBIAN
          cp target/${{ matrix.target }}/release/beatnik-hardware-api $ROOT/opt/beatnik-hardware-api/
          cp -r camilladsp $ROOT/opt/beatnik-hardware-api/

          cp beatnik-hardware.service camilladsp.service camilladsp-preamp.service $ROOT/etc/systemd/system/

          cat > $ROOT/DEBIAN/control <<EOF
          Package: beatnik-hardware-api
          Version: ${VERSION}
          Section: base
          Priority: optional
          Architecture: ${ARCH}
          Depends: libc6
          Maintainer: Beatnik <maintainer@example.com>
          Description: Microservice to configure Raspberry Pi Hardware & CamillaDSP
          EOF

          cat > $ROOT/DEBIAN/postinst <<'EOF'
          #!/bin/sh
          set -e
          systemctl daemon-reload
          systemctl enable beatnik-hardware.service
          systemctl restart beatnik-hardware.service
          # CamillaDSP binary is not part of this package; do not fail the install without it.
          # --no-block: the preamp waits for the Snapserver line-in pipe (no start timeout),
          # so a blocking restart would hang the install on devices without that pipe.
          systemctl enable camilladsp.service || true
          systemctl restart --no-block camilladsp.service || true
          systemctl enable camilladsp-preamp.service || true
          systemctl restart --no-block camilladsp-preamp.service || true
          EOF

          cat > $ROOT/DEBIAN/prerm <<'EOF'
          #!/bin/sh
          systemctl stop beatnik-hardware.service || true
          systemctl disable beatnik-hardware.service || true
          systemctl stop camilladsp.service || true
          systemctl disable camilladsp.service || true
          systemctl stop camilladsp-preamp.service || true
          systemctl disable camilladsp-preamp.service || true
          EOF
          chmod 755 $ROOT/DEBIAN/postinst $ROOT/DEBIAN/prerm

          dpkg-deb --root-owner-group --build $ROOT beatnik-hardware-api_${VERSION}_${ARCH}.deb

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: |
            beatnik-hardware-api-*.tar.gz
            beatnik-hardware-api_*.deb

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            beatnik-hardware-api-*.tar.gz
            beatnik-hardware-api_*.deb
