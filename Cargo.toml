[package]
name = "beatnik-hardware-api"
version = "0.8.0"
edition = "2021"
description = "Microservice to configure Raspberry Pi Hardware & CamillaDSP for Beatnik"
license = "AGPL-3.0-only"
repository = "https://github.com/byrdsandbytes/beatnik-hardware-api"
publish = false

[dependencies]
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
nix = { version = "0.29", features = ["hostname", "net", "user", "feature"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
