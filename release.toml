# cargo-release settings (https://github.com/crate-ci/cargo-release); see RELEASING.md
# Behaves like `npm version`: bump, commit and tag locally; pushing stays manual.
pre-release-commit-message = "{{version}}"
tag-name = "v{{version}}"
tag-message = "{{version}}"
push = false
publish = false
allow-branch = ["master"]
